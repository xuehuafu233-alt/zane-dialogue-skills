<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Zane Dialogue Skills map</title><desc id="desc">Three independent Skills turn unclear questions, unstable AI collaboration, and premature self-labeling into executable questions, corrigible collaboration, and real-world action.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:0}.title{font-size:23px;font-weight:700;fill:#f8fafc}.sub{font-size:12px;fill:#94a3b8}.tag{font-size:10px;font-weight:700}.name{font-size:14px;font-weight:700;fill:#f8fafc}.detail{font-size:10px;fill:#cbd5e1}.out{font-size:12.5px;font-weight:700;fill:#f8fafc}</style></defs>
  <rect width="1200" height="600" fill="#0f172a"/><rect width="1200" height="600" fill="url(#grid)"/>
  <text x="54" y="54" class="title">Clarify the question, stabilize collaboration, return insight to reality</text><text x="54" y="80" class="sub">Use each Skill independently; connect them only when the problem actually crosses layers</text>
  <path d="M340 192H440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 192H860" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 332H440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 332H860" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 472H440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 472H860" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g><rect x="60" y="137" width="280" height="110" rx="8" fill="#0f172a"/><rect x="60" y="137" width="280" height="110" rx="8" fill="rgba(30,41,59,.65)" stroke="#64748b"/><text x="82" y="166" class="tag" fill="#94a3b8">NATURAL LANGUAGE</text><text x="200" y="201" class="name" text-anchor="middle">“What am I really asking?”</text><text x="200" y="226" class="detail" text-anchor="middle">Emotion, judgment, guesses, many tasks</text></g>
  <g><rect x="440" y="127" width="320" height="130" rx="8" fill="#0f172a"/><rect x="440" y="127" width="320" height="130" rx="8" fill="rgba(8,51,68,.5)" stroke="#22d3ee" stroke-width="1.5"/><text x="462" y="157" class="tag" fill="#22d3ee">QUESTION</text><text x="600" y="193" class="name" text-anchor="middle">zane-question-intent-translator</text><text x="600" y="220" class="detail" text-anchor="middle">Desired progress → current decision → gaps</text><text x="600" y="240" class="detail" text-anchor="middle">→ a prompt any general AI can execute</text></g>
  <g><rect x="860" y="147" width="280" height="90" rx="45" fill="#0f172a"/><rect x="860" y="147" width="280" height="90" rx="45" fill="rgba(6,78,59,.5)" stroke="#34d399" stroke-width="1.5"/><text x="1000" y="185" class="out" text-anchor="middle">A clear, executable question</text><text x="1000" y="211" class="detail" text-anchor="middle">Keep the stance; test the assumption</text></g>
  <g><rect x="60" y="277" width="280" height="110" rx="8" fill="#0f172a"/><rect x="60" y="277" width="280" height="110" rx="8" fill="rgba(30,41,59,.65)" stroke="#64748b"/><text x="82" y="306" class="tag" fill="#94a3b8">LONG-TERM AI</text><text x="200" y="341" class="name" text-anchor="middle">“Why is behavior unstable?”</text><text x="200" y="366" class="detail" text-anchor="middle">Persona adjectives, no operating agreement</text></g>
  <g><rect x="440" y="267" width="320" height="130" rx="8" fill="#0f172a"/><rect x="440" y="267" width="320" height="130" rx="8" fill="rgba(76,29,149,.5)" stroke="#a78bfa" stroke-width="1.5"/><text x="462" y="297" class="tag" fill="#a78bfa">COLLABORATION</text><text x="600" y="333" class="name" text-anchor="middle">zane-agent-identity-card-builder</text><text x="600" y="360" class="detail" text-anchor="middle">Identity · judgment · purpose &amp; action</text><text x="600" y="380" class="detail" text-anchor="middle">Memory · correction · power boundaries</text></g>
  <g><rect x="860" y="287" width="280" height="90" rx="45" fill="#0f172a"/><rect x="860" y="287" width="280" height="90" rx="45" fill="rgba(59,130,246,.42)" stroke="#60a5fa" stroke-width="1.5"/><text x="1000" y="325" class="out" text-anchor="middle">Reliable, corrigible collaboration</text><text x="1000" y="351" class="detail" text-anchor="middle">Make judgments; update with evidence</text></g>
  <g><rect x="60" y="417" width="280" height="110" rx="8" fill="#0f172a"/><rect x="60" y="417" width="280" height="110" rx="8" fill="rgba(30,41,59,.65)" stroke="#64748b"/><text x="82" y="446" class="tag" fill="#94a3b8">SELF-UNDERSTANDING</text><text x="200" y="481" class="name" text-anchor="middle">“What does this say about me?”</text><text x="200" y="506" class="detail" text-anchor="middle">One event becomes a personality verdict</text></g>
  <g><rect x="440" y="407" width="320" height="130" rx="8" fill="#0f172a"/><rect x="440" y="407" width="320" height="130" rx="8" fill="rgba(120,53,15,.45)" stroke="#fbbf24" stroke-width="1.5"/><text x="462" y="437" class="tag" fill="#fbbf24">SELF-INSIGHT</text><text x="600" y="473" class="name" text-anchor="middle">zane-self-insight</text><text x="600" y="500" class="detail" text-anchor="middle">Fact · experience · narrative · script</text><text x="600" y="520" class="detail" text-anchor="middle">→ provisional judgment &amp; falsifiable test</text></g>
  <g><rect x="860" y="427" width="280" height="90" rx="45" fill="#0f172a"/><rect x="860" y="427" width="280" height="90" rx="45" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/><text x="1000" y="465" class="out" text-anchor="middle">Agency in real-world action</text><text x="1000" y="491" class="detail" text-anchor="middle">Not a label: insight life can test</text></g>
</svg>
