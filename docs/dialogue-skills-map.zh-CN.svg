<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Zane Dialogue Skills 方法图</title>
  <desc id="desc">三个独立技能分别处理问题转译、AI身份卡和自我认识，并共同指向清晰问题、可靠协作与现实行动。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <style>text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif;letter-spacing:0}.title{font-size:24px;font-weight:700;fill:#f8fafc}.sub{font-size:12px;fill:#94a3b8}.tag{font-size:10px;font-weight:700}.name{font-size:16px;font-weight:700;fill:#f8fafc}.detail{font-size:11px;fill:#cbd5e1}.out{font-size:15px;font-weight:700;fill:#f8fafc}</style>
  </defs>
  <rect width="1200" height="600" fill="#0f172a"/><rect width="1200" height="600" fill="url(#grid)"/>
  <text x="54" y="54" class="title">先把问题说清，再让 AI 稳定协作，最后把认识带回现实</text>
  <text x="54" y="80" class="sub">三个 Skills 可以独立使用；只有问题真的跨层时才串联</text>

  <path d="M340 192H440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 192H860" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M340 332H440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 332H860" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M340 472H440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 472H860" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g><rect x="60" y="137" width="280" height="110" rx="8" fill="#0f172a"/><rect x="60" y="137" width="280" height="110" rx="8" fill="rgba(30,41,59,.65)" stroke="#64748b"/><text x="82" y="166" class="tag" fill="#94a3b8">自然语言现场</text><text x="200" y="201" class="name" text-anchor="middle">“我真正想问什么？”</text><text x="200" y="226" class="detail" text-anchor="middle">情绪、判断、猜测与多个任务混在一起</text></g>
  <g><rect x="440" y="127" width="320" height="130" rx="8" fill="#0f172a"/><rect x="440" y="127" width="320" height="130" rx="8" fill="rgba(8,51,68,.5)" stroke="#22d3ee" stroke-width="1.5"/><text x="462" y="157" class="tag" fill="#22d3ee">QUESTION</text><text x="600" y="193" class="name" text-anchor="middle">zane-question-intent-translator</text><text x="600" y="220" class="detail" text-anchor="middle">真实进展 → 当前决定 → 歧义与前提</text><text x="600" y="240" class="detail" text-anchor="middle">→ 可以直接继续对话的提示词</text></g>
  <g><rect x="860" y="147" width="280" height="90" rx="45" fill="#0f172a"/><rect x="860" y="147" width="280" height="90" rx="45" fill="rgba(6,78,59,.5)" stroke="#34d399" stroke-width="1.5"/><text x="1000" y="185" class="out" text-anchor="middle">清晰、可执行的问题</text><text x="1000" y="211" class="detail" text-anchor="middle">保留立场，但不把假设当事实</text></g>

  <g><rect x="60" y="277" width="280" height="110" rx="8" fill="#0f172a"/><rect x="60" y="277" width="280" height="110" rx="8" fill="rgba(30,41,59,.65)" stroke="#64748b"/><text x="82" y="306" class="tag" fill="#94a3b8">长期协作现场</text><text x="200" y="341" class="name" text-anchor="middle">“为什么 AI 总不稳定？”</text><text x="200" y="366" class="detail" text-anchor="middle">会说人格形容词，却没有运行协议</text></g>
  <g><rect x="440" y="267" width="320" height="130" rx="8" fill="#0f172a"/><rect x="440" y="267" width="320" height="130" rx="8" fill="rgba(76,29,149,.5)" stroke="#a78bfa" stroke-width="1.5"/><text x="462" y="297" class="tag" fill="#a78bfa">COLLABORATION</text><text x="600" y="333" class="name" text-anchor="middle">zane-agent-identity-card-builder</text><text x="600" y="360" class="detail" text-anchor="middle">身份 · 判断 · 目的与行动 · 记忆</text><text x="600" y="380" class="detail" text-anchor="middle">纠错 · 权限与关系边界</text></g>
  <g><rect x="860" y="287" width="280" height="90" rx="45" fill="#0f172a"/><rect x="860" y="287" width="280" height="90" rx="45" fill="rgba(59,130,246,.42)" stroke="#60a5fa" stroke-width="1.5"/><text x="1000" y="325" class="out" text-anchor="middle">可靠、可纠正的协作</text><text x="1000" y="351" class="detail" text-anchor="middle">敢判断，也允许新事实推翻</text></g>

  <g><rect x="60" y="417" width="280" height="110" rx="8" fill="#0f172a"/><rect x="60" y="417" width="280" height="110" rx="8" fill="rgba(30,41,59,.65)" stroke="#64748b"/><text x="82" y="446" class="tag" fill="#94a3b8">自我认识现场</text><text x="200" y="481" class="name" text-anchor="middle">“这说明我是怎样的人？”</text><text x="200" y="506" class="detail" text-anchor="middle">一次经历被迅速升级成人格结论</text></g>
  <g><rect x="440" y="407" width="320" height="130" rx="8" fill="#0f172a"/><rect x="440" y="407" width="320" height="130" rx="8" fill="rgba(120,53,15,.45)" stroke="#fbbf24" stroke-width="1.5"/><text x="462" y="437" class="tag" fill="#fbbf24">SELF-INSIGHT</text><text x="600" y="473" class="name" text-anchor="middle">zane-self-insight</text><text x="600" y="500" class="detail" text-anchor="middle">事实 · 体验 · 自我叙述 · 外部脚本</text><text x="600" y="520" class="detail" text-anchor="middle">→ 暂定判断与可证伪的小实验</text></g>
  <g><rect x="860" y="427" width="280" height="90" rx="45" fill="#0f172a"/><rect x="860" y="427" width="280" height="90" rx="45" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/><text x="1000" y="465" class="out" text-anchor="middle">有主体性的现实行动</text><text x="1000" y="491" class="detail" text-anchor="middle">不是标签，而是能被生活检验的认识</text></g>
</svg>
